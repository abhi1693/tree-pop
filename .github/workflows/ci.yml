name: CI
on:
  push:
    branches:
      - master
  pull_request: null
env:
  DO_NOT_TRACK: '1'
jobs:
  build:
    uses: abhi1693/actions/.github/workflows/node-ci.yml@v1
    with:
      checks: '["lint", "test", "build"]'
      scripts: '{"lint": "lint", "test": "test", "build": "build"}'
      timeout-minutes: 20
      runs-on: ubuntu-latest
      node-version: '24'
      project-env: '{"DO_NOT_TRACK":"1"}'
